<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BloxArcade – 96 Games</title>
<style>
:root{--bg:#120c1f;--ink:#fff4e0;--hot:#ff5e3a;--sun:#ffc531;--mint:#2de2a6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px}
header{padding:34px 5% 12px;display:flex;flex-wrap:wrap;gap:18px;align-items:end;justify-content:space-between}
h1{margin:0;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(38px,7vw,76px);letter-spacing:1px;line-height:.95;text-shadow:4px 4px 0 var(--hot),8px 8px 0 #0006}
h1 small{display:block;font:14px "Trebuchet MS";letter-spacing:0;text-shadow:none;opacity:.7;margin-top:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
input{background:#ffffff14;border:2px solid #ffffff30;color:var(--ink);padding:12px 16px;border-radius:12px;font-size:16px;min-width:220px}
input:focus,button:focus-visible,.card:focus-visible{outline:3px solid var(--sun)}
button{cursor:pointer;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:var(--sun);color:#2a1500;box-shadow:0 4px 0 #a06b00}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a06b00}
.tabs{padding:6px 5% 18px;display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:#ffffff14;color:var(--ink);box-shadow:none;padding:9px 14px;border:2px solid #ffffff22}
.tabs button.on{background:var(--hot);border-color:var(--hot)}
#grid{padding:0 5% 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{border-radius:18px;padding:16px;cursor:pointer;background:linear-gradient(160deg,hsl(var(--h) 70% 38%),hsl(var(--h) 60% 16%));border:2px solid #ffffff25;transition:transform .15s,box-shadow .15s;min-height:170px;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 12px 0 #0005}
.card .e{font-size:54px;line-height:1.1}.card b{font-size:16px;margin-top:auto}.card i{font-style:normal;font-size:12px;opacity:.75;margin-top:4px}
.card em{font-style:normal;font-size:12px;color:var(--sun);margin-top:4px}
#stage{position:fixed;inset:0;background:#000;display:none;place-items:center;z-index:9}
#stage.on{display:grid}
canvas{width:min(100vw,160vh);aspect-ratio:8/5;background:#111;touch-action:none}
#none{padding:0 5%;display:none;opacity:.7}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body>
<header>
<h1>BLOXARCADE<small id="cnt"></small></h1>
<div class="tools"><input id="q" placeholder="Search games…" aria-label="Search games"><button id="rnd">🎲 Random game</button></div>
</header>
<nav class="tabs" id="tabs"></nav>
<p id="none">No games match. Try another word.</p>
<main id="grid"></main>
<div id="stage"><canvas id="cv" width="800" height="500"></canvas></div>

<script>
const W=800,H=500,$=s=>document.querySelector(s),cv=$('#cv'),c=cv.getContext('2d'),R=Math.random;
const TY={m:['⌨️ Key Mash','Press the glowing letter fast! Wrong key slows you.'],r:['🏃 Runner','SPACE / ↑ / click to jump'],c:['🧺 Catcher','←→ or mouse to move. Dodge 💣, don\'t miss loot'],w:['🔨 Whack','Click holes, or Q W E / A S D / Z X C. Skip 💀'],s:['🕵️ Heist','WASD / arrows: grab loot, bring it to base'],k:['💰 Tycoon','Click or SPACE to earn · keys 1-3 buy upgrades']};
const L={
m:"⌨️ +1 Speed Keyboard Escape;👟 Speed Sneaker Escape;🚀 Rocket Key Rush;🐢 Turtle Turbo Escape;🧟 Zombie Typing Escape;🦖 Dino Dash Escape;🌋 Lava Run Mash;🏎️ Key Racer 3000;👻 Ghost Chase Keys;🐉 Dragon Flee Mash;🦈 Shark Sprint;🛸 UFO Escape Keys;🧊 Ice Cave Sprint;🚂 Train Chase Typing;🦁 Safari Speed Escape;🌪️ Tornado Typing Rush",
r:"🏃 Escape the Obby;🌈 Rainbow Obby Run;🧟 Zombie Parkour Dash;🦘 Kangaroo Obby;🐸 Frog Hop Escape;🕷️ Spider Cave Runner;🏰 Tower Sprint;🛹 Skate Park Obby;🦊 Fox Forest Dash;🔥 Lava Floor Jumper;🎃 Pumpkin Patch Run;🐧 Penguin Slide Dash;🌵 Desert Cactus Run;🌌 Space Obby Dash;🍕 Pizza Delivery Dash;🐰 Bunny Bounce Run",
c:"🍎 Fruit Catch Frenzy;🍩 Donut Rain;🪙 Coin Shower;💎 Gem Catcher;🍬 Candy Storm;🥭 Mango Madness;🐟 Fish Fall Frenzy;⭐ Star Collector;🍔 Burger Blitz;🧁 Cupcake Catcher;🎁 Gift Drop Party;🍄 Mushroom Rain;🦴 Doggo Bone Drop;🌽 Corn Harvest Rush;🍓 Berry Basket;🍌 Banana Blitz",
w:"🔨 Whack-a-Noob;🐹 Hamster Smash;🧟 Zombie Pop-Up;👾 Alien Invasion Whack;🐭 Mouse Hole Mayhem;🦆 Duck Pond Pop;🤡 Clown Pop;🐛 Bug Squasher;🎈 Balloon Pop Panic;🐙 Octopus Smash;🥷 Ninja Pop;🦇 Bat Cave Whack;🍕 Pizza Pop;🐔 Chicken Coop Chaos;🧙 Wizard Whack;🤖 Robot Reboot Whack",
s:"🧠 Steal a Brainrot;🥚 Steal Eggs;🍩 Steal a Donut;💎 Steal the Diamond;🐶 Steal a Puppy;🍕 Steal Pizza Slices;👑 Steal the Crown;🐲 Steal Dragon Eggs;🧸 Steal a Plushie;🍌 Steal a Banana;🏆 Steal the Trophy;🧪 Steal the Potion;🦄 Steal a Unicorn;🎮 Steal a Console;🍯 Steal the Honey;🪙 Steal Gold Bars",
k:"💰 Brainrot Tycoon;🥚 Egg Farm Tycoon;🍔 Burger Tycoon;🏭 Factory Tycoon;🎣 Fishing Simulator;⛏️ Mining Simulator;🐾 Pet Simulator;🍦 Ice Cream Empire;🌾 Farm Life Tycoon;🚀 Space Tycoon;🏝️ Island Tycoon;🎰 Lucky Block Tycoon;🧃 Juice Stand Tycoon;🧙 Wizard Tower Tycoon;🚗 Car Dealer Tycoon;🐉 Dragon Hoard Tycoon"};
const games=[];
Object.keys(L).forEach(t=>L[t].split(';').forEach(s=>{const i=s.indexOf(' ');games.push({e:s.slice(0,i),n:s.slice(i+1),t,h:games.length*37%360,id:games.length})}));

/* ---------- helpers ---------- */
const tx=(t,x,y,s=24,a='center',col='#fff')=>{c.font=`bold ${s}px "Trebuchet MS",sans-serif`;c.textAlign=a;c.textBaseline='middle';c.fillStyle=col;c.fillText(t,x,y)};
const rect=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
const rr=(x,y,w,h,col)=>{c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,14);c.fill()};
const hit=(a,b,r)=>Math.hypot(a.x-b.x,a.y-b.y)<r;
const K=new Set();

/* ---------- game templates: each returns {u(dt), d(), k(key), p(x,y), m(x), s, lv, over} ---------- */
const TPL={
// ⌨️ Keyboard escape: alternate glowing letters, outrun the chaser
m:g=>{let pos=0,sp=0,mon=-120,tm=0,KS="ASDFJKL",tg=KS[R()*7|0];
 return{s:0,
 u(dt){tm+=dt;sp=Math.max(0,sp-dt*1.2);pos+=sp*dt*12;mon+=(40+tm*2)*dt;this.s=pos/10|0;if(mon>=pos)this.over=1},
 k(e){if(e.length==1){if(e.toUpperCase()==tg){sp+=1;tg=KS[R()*7|0]}else sp*=.8}},
 p(){this.k(tg)},
 d(){let gap=pos-mon,mx=560-Math.min(480,Math.max(0,gap)*2.2);
  rect(0,330,W,170,'#0007');
  for(let i=0;i<10;i++)rect(((i*90-pos*2.5)%900+900)%900-90,420,50,6,'#fff5');
  tx(g.e,mx,372+Math.sin(tm*14)*6,70);tx('🏃',560,372+Math.sin(pos/6)*8,60);
  rr(340,70,120,120,'#ffffff18');tx(tg,400,130,96,'center','#ffc531');
  rect(200,250,400,16,'#0006');rect(200,250,Math.min(400,sp*25),16,'#2de2a6');
  tx('SPEED +'+sp.toFixed(1),400,290,20);tx(gap<80?'⚠️ IT\'S CLOSE!':'',400,320,22,'center','#ff5e3a')}}},
// 🏃 Obby runner: jump over obstacles
r:g=>{let y=0,vy=0,o=[],tm=0,nx=1;
 const j=()=>{if(y==0)vy=720};
 return{s:0,k:e=>(e==' '||e=='ArrowUp'||e=='w')&&j(),p:j,
 u(dt){tm+=dt;let sp=300+tm*10;vy-=1800*dt;y=Math.max(0,y+vy*dt);if(y==0)vy=0;
  if((nx-=dt)<0){o.push({x:W+30,h:30+R()*40});nx=(.8+R())*300/sp+.25}
  o.forEach(b=>b.x-=sp*dt);o=o.filter(b=>b.x>-50);this.s=tm*10|0;
  if(o.some(b=>b.x-18<140&&b.x+18>100&&y<b.h-6))this.over=1},
 d(){rect(0,400,W,100,'#0008');for(let i=0;i<9;i++)rect(((i*100-tm*300)%900+900)%900-100,400,60,5,'#fff4');
  o.forEach(b=>tx(g.e,b.x,400-(b.h+20)/2,b.h+20));tx('🏃',120,368-y,60)}}},
// 🧺 Catcher: move basket, catch loot, avoid bombs
c:g=>{let x=400,it=[],tm=0,nx=0;
 return{s:0,lv:3,m:v=>x=v,
 u(dt){tm+=dt;if(K.has('arrowleft')||K.has('a'))x-=520*dt;if(K.has('arrowright')||K.has('d'))x+=520*dt;x=Math.max(40,Math.min(760,x));
  if((nx-=dt)<0){it.push({x:40+R()*720,y:-30,g:R()>.25});nx=Math.max(.3,.9-tm*.01)}
  it.forEach(i=>i.y+=(160+tm*5)*dt);
  it=it.filter(i=>{if(i.y>430&&i.y<480&&Math.abs(i.x-x)<55){i.g?this.s++:this.lv--;return 0}
   if(i.y>520){if(i.g)this.lv--;return 0}return 1});if(this.lv<=0)this.over=1},
 d(){it.forEach(i=>tx(i.g?g.e:'💣',i.x,i.y,46));tx('🧺',x,445,76)}}},
// 🔨 Whack: 45 seconds of pop-ups
w:g=>{let h=Array(9).fill(0),tm=45,nx=0;const KS="qweasdzxc";
 const P=i=>({x:200+i%3*200,y:150+(i/3|0)*130});
 const hitI=i=>{let t=h[i];if(!t)return;o.s=Math.max(0,o.s+(t.b?-3:1));h[i]=0};
 const o={s:0,u(dt){tm-=dt;if(tm<=0)this.over=1;if((nx-=dt)<0){let i=R()*9|0;if(!h[i])h[i]={t:1.1-(45-tm)*.01,b:R()<.2};nx=.2+.5*(tm/45)}
  h.forEach((t,i)=>{if(t&&(t.t-=dt)<0)h[i]=0})},
 k(e){let i=KS.indexOf(e.toLowerCase());if(i>=0)hitI(i)},
 p(x,y){for(let i=0;i<9;i++)if(Math.hypot(P(i).x-x,P(i).y-y)<70)hitI(i)},
 d(){for(let i=0;i<9;i++){let q=P(i);c.fillStyle='#0009';c.beginPath();c.ellipse(q.x,q.y+30,70,26,0,0,7);c.fill();
   if(h[i])tx(h[i].b?'💀':g.e,q.x,q.y,72);tx(KS[i].toUpperCase(),q.x,q.y+58,14,'center','#fff6')}
  tx('⏱ '+Math.ceil(tm)+'s',400,40,26,'center','#ffc531')}};
 return o},
// 🕵️ Heist: grab loot, return to base, dodge guards
s:g=>{let p={x:50,y:250},car=0,it={x:740,y:250},gd=[],inv=0;
 const sp=()=>{it={x:700+R()*70,y:60+R()*380}},add=()=>gd.push({x:400+R()*300,y:60+R()*380,vx:(R()<.5?-1:1)*(110+gd.length*14),vy:(R()<.5?-1:1)*(90+R()*60)});
 add();add();
 return{s:0,lv:3,
 u(dt){let v=car?190:250,dx=(K.has('arrowright')||K.has('d'))-(K.has('arrowleft')||K.has('a')),dy=(K.has('arrowdown')||K.has('s'))-(K.has('arrowup')||K.has('w'));
  p.x=Math.max(20,Math.min(780,p.x+dx*v*dt));p.y=Math.max(30,Math.min(470,p.y+dy*v*dt));inv=Math.max(0,inv-dt);
  if(!car&&hit(p,it,40))car=1;
  if(car&&p.x<90){car=0;this.s++;sp();if(gd.length<9)add()}
  gd.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.x<120||q.x>780)q.vx*=-1;if(q.y<30||q.y>470)q.vy*=-1;
   if(!inv&&hit(p,q,38)){this.lv--;car=0;inv=1.5;p.x=50;p.y=250;sp()}});if(this.lv<=0)this.over=1},
 d(){rr(0,0,90,H,'#2de2a655');tx('BASE',45,250,16);if(!car)tx(g.e,it.x,it.y,50);
  gd.forEach(q=>tx('👹',q.x,q.y,50));if(inv%.3<.15)tx('🏃',p.x,p.y,50);if(car)tx(g.e,p.x,p.y-38,34)}}},
// 💰 Tycoon: click, buy upgrades
k:g=>{let cash=0,tot=0,pop=0,u=[{n:'Stronger click',b:15,c:15,v:0,d:'+1 per click'},{n:'Auto collector',b:60,c:60,v:0,d:'+1 per second'},{n:'Mega factory',b:500,c:500,v:0,d:'+10 per second'}];
 const buy=i=>{let x=u[i];if(cash>=x.c){cash-=x.c;x.v++;x.c=Math.ceil(x.c*1.35)}},clk=()=>{let a=1+u[0].v;cash+=a;tot+=a;pop=1};
 return{s:0,
 u(dt){let a=(u[1].v+u[2].v*10)*dt;cash+=a;tot+=a;pop=Math.max(0,pop-dt*6);this.s=tot|0},
 k(e){if(e==' ')clk();if('123'.includes(e))buy(e-1)},
 p(x,y){if(x<460)clk();else{let i=(y-130)/90|0;if(y>130&&i<3&&x>480&&x<780)buy(i)}},
 d(){tx('$'+(cash|0).toLocaleString(),250,70,48,'center','#ffc531');tx(g.e,250,260,150+pop*30);tx('tap me!',250,400,18,'center','#fff8');
  u.forEach((x,i)=>{rr(480,130+i*90,300,76,cash>=x.c?'#2de2a644':'#ffffff14');tx(`${i+1}. ${x.n}  (Lv ${x.v})`,496,155+i*90,18,'left');tx(x.d+' — $'+x.c.toLocaleString(),496,182+i*90,15,'left','#fffa')});
  tx('Income: $'+(u[1].v+u[2].v*10)+'/s',630,100,18,'center','#2de2a6')}}}
};

/* ---------- platform ---------- */
let G=null,cur=null,raf,last,saved,filt='all';
const store=()=>{try{return JSON.parse(localStorage.getItem('bloxarcade')||'{}')}catch(e){return{}}};
const best=id=>store()[id]||0;
function saveBest(){if(saved)return;saved=1;try{let s=store();if(G.s>(s[cur.id]||0)){s[cur.id]=G.s|0;localStorage.setItem('bloxarcade',JSON.stringify(s))}}catch(e){}}
function launch(id){cur=games[id];G=TPL[cur.t](cur);G.s=G.s||0;saved=0;K.clear();$('#stage').classList.add('on');cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop)}
function exit(){if(!G)return;saveBest();G=null;cancelAnimationFrame(raf);$('#stage').classList.remove('on');render()}
function loop(n){if(!G)return;let dt=Math.min(.05,(n-last)/1000);last=n;if(!G.over)G.u(dt);else saveBest();draw();raf=requestAnimationFrame(loop)}
function draw(){let gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,`hsl(${cur.h} 55% 22%)`);gr.addColorStop(1,`hsl(${cur.h+40} 50% 8%)`);c.fillStyle=gr;c.fillRect(0,0,W,H);
 G.d();
 tx(cur.e+' '+(G.s|0),16,26,24,'left');tx('Best '+Math.max(best(cur.id),G.s|0),W-16,26,16,'right','#ffc531');
 if(G.lv!=null)tx('❤️'.repeat(Math.max(0,G.lv)),W/2,26,20);
 tx(TY[cur.t][1]+'   ·   Esc = menu',W/2,H-16,14,'center','#fff9');
 if(G.over){rect(0,0,W,H,'#000b');tx('GAME OVER',W/2,170,64,'center','#ff5e3a');tx('Score: '+(G.s|0),W/2,240,36);tx('New best!',W/2,280,20,'center',G.s>=best(cur.id)&&G.s>0?'#2de2a6':'#0000');
  tx('Click or press R to retry',W/2,330,22);tx('Esc for the menu',W/2,365,18,'center','#fff9')}}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
 if(e.key=='Escape'){exit();return}
 if(!G)return;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
 K.add(e.key.toLowerCase());
 if(G.over){if(e.key.toLowerCase()=='r')launch(cur.id);return}
 G.k&&G.k(e.key.length>1||e.key==' '?e.key:e.key)});
addEventListener('keyup',e=>K.delete(e.key.toLowerCase()));
const pt=e=>{let r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
cv.addEventListener('pointerdown',e=>{if(!G)return;if(G.over){launch(cur.id);return}let[x,y]=pt(e);G.p&&G.p(x,y)});
cv.addEventListener('pointermove',e=>{if(G&&G.m)G.m(pt(e)[0])});

/* ---------- menu ---------- */
const tabs=[['all','🎮 All'],...Object.keys(TY).map(k=>[k,TY[k][0]])];
$('#tabs').innerHTML=tabs.map(t=>`<button data-t="${t[0]}" class="${t[0]=='all'?'on':''}">${t[1]}</button>`).join('');
$('#tabs').onclick=e=>{let b=e.target.closest('button');if(!b)return;filt=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x==b));render()};
$('#q').oninput=render;
$('#rnd').onclick=()=>launch(R()*games.length|0);
$('#grid').onclick=e=>{let k=e.target.closest('.card');if(k)launch(+k.dataset.id)};
$('#grid').onkeydown=e=>{if(e.key=='Enter'&&e.target.dataset.id)launch(+e.target.dataset.id)};
function render(){let q=$('#q').value.toLowerCase(),list=games.filter(g=>(filt=='all'||g.t==filt)&&g.n.toLowerCase().includes(q));
 $('#grid').innerHTML=list.map(g=>`<div class="card" tabindex="0" data-id="${g.id}" style="--h:${g.h}"><span class="e">${g.e}</span><b>${g.n}</b><i>${TY[g.t][0]}</i>${best(g.id)?`<em>Best: ${best(g.id).toLocaleString()}</em>`:''}</div>`).join('');
 $('#none').style.display=list.length?'none':'block';
 $('#cnt').textContent=`${games.length} games · click one to play · Esc returns here`}
render();
</script></body></html>
